[project]
name = "turntable-lfo-extractor"
version = "0.1.0"
description = "Extract a hard-quantized turntable-RPM step-LFO from raw video motion."
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "opencv-python>=4.7"]

[project.scripts]
turntable-lfo = "turntable_lfo.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["turntable_lfo"]
